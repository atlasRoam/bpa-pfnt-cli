name: Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Privacy and publication audit
        run: python scripts/public_audit.py
      - name: Verify distribution manifest
        run: python scripts/verify_distribution.py
      - name: Validate manifest schema
        run: python -c "import json; d=json.load(open('MANIFEST.json',encoding='utf-8')); assert d['schema_version']=='bpa-pfnt-distribution/1.0'; assert len(d['assets']) > 0"
